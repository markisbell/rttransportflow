name: ci

on:
  push:
    branches: [main]
  pull_request:
  # manual: the macOS bundle build (macOS runner minutes are 10x billed,
  # so it is never part of the per-push matrix)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # MEASURED on the runner: 8m 24s (the suite itself 7m 45s), against
    # ~5 min on a 20-core dev box — the gap is smaller than it looks because
    # the suite is mostly serial numba work. 30 min is ~3.5x that, which
    # catches a hang without failing a merely slow run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  freeze-smoke:
    # Family lesson: the PyInstaller freeze smoke lives in P4 CI, not P10.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]" pyinstaller
          python -m venv .venv --system-site-packages
      - name: Freeze and smoke
        run: ./scripts/freeze_backend.sh

  game-tests:
    # GdUnit + the FAST smokes. The heavy ones (campaign_take_the_reins is
    # 194 wire steps over a 142-plant continent, soak is 24 in-game hours)
    # stay local: they are minutes each and CI is not where you discover
    # them. `scenarios` needs no backend; the others spawn one, so the
    # sidecar's `.venv/bin/python` has to exist here too.
    runs-on: ubuntu-latest
    # measured 1m 52s (Godot download + GdUnit + four smokes); 20 min is a
    # hang guard, not a budget
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          pip install -e ".[dev]"
          python -m venv .venv --system-site-packages
      - name: Fetch Godot
        # the version pin has ONE home: GODOT_PIN in scripts/find_godot.sh
        run: |
          GODOT_PIN=$(grep -m1 '^GODOT_PIN=' scripts/find_godot.sh | cut -d'"' -f2)
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_PIN}-stable/Godot_v${GODOT_PIN}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_PIN}-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/Godot_v${GODOT_PIN}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        # first headless open builds .godot/ (script class cache, imports);
        # without it the first real run fails to resolve class_names
        run: |
          cd game
          "$GODOT_BIN" --headless --import --path . || true
      - name: GdUnit suites
        # GdUnitCmdTool directly, not runtest.sh: the vendored wrapper runs
        # the suites WITHOUT --headless (it only passes the flag to its
        # log-copy pass), so on a runner with no display Godot fails to
        # create a DisplayServer and the job dies before a single test runs.
        # Patching a vendored addon would be undone by the next upgrade.
        # --remote-debug on an unbound port keeps Godot's interactive CLI
        # debugger from looping on a parse error, exactly as the wrapper does.
        # --ignoreHeadlessMode: GdUnit refuses headless by default because it
        # breaks UI tests; these suites are pure logic (topology, demand,
        # weather, campaign), so the check is not protecting anything here.
        run: |
          cd game
          "$GODOT_BIN" --headless --path . -s -d \
            --remote-debug tcp://127.0.0.1:0 \
            res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -a tests
      - name: Fast smokes
        run: |
          cd game
          for s in scenarios ui_boot boot_and_day trip_reaction island_cut; do
            echo "::group::$s"
            timeout 900 "$GODOT_BIN" --headless --path . -- --smoke=$s | tee "/tmp/$s.log"
            grep -q '"ok":true' "/tmp/$s.log" || { echo "$s FAILED"; exit 1; }
            echo "::endgroup::"
          done

  image:
    # Test-gated container publish (ROADMAP P10). Only on main, only after
    # the suites pass — an image that was never tested is worse than no
    # image, because someone will run it.
    needs: [test, game-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

  macos-bundle:
    # The macOS installer (player request 2026-08-22). PyInstaller cannot
    # cross-compile, so the frozen backend MUST be built on a Mac — this
    # job is the project's only Mac. Manual trigger (gh workflow run ci.yml)
    # because macOS runner minutes bill at 10x. Apple Silicon only: the
    # macos-14 runner is arm64 and so is everything it freezes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          pip install -e ".[dev]" pyinstaller
          python -m venv .venv --system-site-packages
      - name: Fetch Godot (macOS editor + export templates)
        # the version pin has ONE home: GODOT_PIN in scripts/find_godot.sh
        run: |
          GODOT_PIN=$(grep -m1 '^GODOT_PIN=' scripts/find_godot.sh | cut -d'"' -f2)
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_PIN}-stable/Godot_v${GODOT_PIN}-stable_macos.universal.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_PIN}-stable/Godot_v${GODOT_PIN}-stable_export_templates.tpz"
          unzip -q templates.tpz
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_PIN}.stable"
          mkdir -p "$DEST"
          mv templates/* "$DEST"/
      - name: Import project
        run: |
          cd game
          "$GODOT" --headless --import --path . || true
      - name: Package and verify (plays the bundle)
        run: ./scripts/package_game.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: rttransportflow-macos-arm64
          path: build/dist/rttransportflow-*-macos-arm64.zip
          if-no-files-found: error

  windows-bundle:
    # The Windows installer, same shape as macos-bundle: PyInstaller
    # freezes for its build host, so the backend must be built ON Windows.
    # Manual trigger; Windows runner minutes bill at 2x.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          pip install -e ".[dev]" pyinstaller
          python -m venv .venv --system-site-packages
      - name: Fetch Godot (Windows editor + export templates)
        # the version pin has ONE home: GODOT_PIN in scripts/find_godot.sh
        run: |
          GODOT_PIN=$(grep -m1 '^GODOT_PIN=' scripts/find_godot.sh | cut -d'"' -f2)
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_PIN}-stable/Godot_v${GODOT_PIN}-stable_win64.exe.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_PIN}-stable_win64.exe" >> "$GITHUB_ENV"
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_PIN}-stable/Godot_v${GODOT_PIN}-stable_export_templates.tpz"
          unzip -q templates.tpz
          DEST="$APPDATA/Godot/export_templates/${GODOT_PIN}.stable"
          mkdir -p "$DEST"
          mv templates/* "$DEST"/
      - name: Import project
        run: |
          cd game
          "$GODOT" --headless --import --path . || true
      - name: Package and verify (plays the bundle)
        run: ./scripts/package_game.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: rttransportflow-windows-x86_64
          path: build/dist/rttransportflow-*-windows-x86_64.zip
          if-no-files-found: error
