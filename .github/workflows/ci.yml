name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # the dynamics suite is minutes on 20 cores and slower on a 2-core
    # runner, but a HANG should fail here rather than burn the 6 h default
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  freeze-smoke:
    # Family lesson: the PyInstaller freeze smoke lives in P4 CI, not P10.
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]" pyinstaller
          python -m venv .venv --system-site-packages
      - name: Freeze and smoke
        run: ./scripts/freeze_backend.sh

  game-tests:
    # GdUnit + the FAST smokes. The heavy ones (campaign_take_the_reins is
    # 194 wire steps over a 142-plant continent, soak is 24 in-game hours)
    # stay local: they are minutes each and CI is not where you discover
    # them. `scenarios` needs no backend; the others spawn one, so the
    # sidecar's `.venv/bin/python` has to exist here too.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          pip install -e ".[dev]"
          python -m venv .venv --system-site-packages
      - name: Fetch Godot
        run: |
          curl -sSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          echo "GODOT_BIN=$PWD/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        # first headless open builds .godot/ (script class cache, imports);
        # without it the first real run fails to resolve class_names
        run: |
          cd game
          "$GODOT_BIN" --headless --import --path . || true
      - name: GdUnit suites
        # GdUnitCmdTool directly, not runtest.sh: the vendored wrapper runs
        # the suites WITHOUT --headless (it only passes the flag to its
        # log-copy pass), so on a runner with no display Godot fails to
        # create a DisplayServer and the job dies before a single test runs.
        # Patching a vendored addon would be undone by the next upgrade.
        # --remote-debug on an unbound port keeps Godot's interactive CLI
        # debugger from looping on a parse error, exactly as the wrapper does.
        # --ignoreHeadlessMode: GdUnit refuses headless by default because it
        # breaks UI tests; these suites are pure logic (topology, demand,
        # weather, campaign), so the check is not protecting anything here.
        run: |
          cd game
          "$GODOT_BIN" --headless --path . -s -d \
            --remote-debug tcp://127.0.0.1:0 \
            res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            --ignoreHeadlessMode -a tests
      - name: Fast smokes
        run: |
          cd game
          for s in scenarios ui_boot boot_and_day trip_reaction island_cut; do
            echo "::group::$s"
            timeout 900 "$GODOT_BIN" --headless --path . -- --smoke=$s | tee "/tmp/$s.log"
            grep -q '"ok":true' "/tmp/$s.log" || { echo "$s FAILED"; exit 1; }
            echo "::endgroup::"
          done

  image:
    # Test-gated container publish (ROADMAP P10). Only on main, only after
    # the suites pass — an image that was never tested is worse than no
    # image, because someone will run it.
    needs: [test, game-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
